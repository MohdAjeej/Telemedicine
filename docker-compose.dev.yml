# Override for local development with hot-reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Mounts source into the containers and runs the dev servers instead of the
# production build, so edits on the host are picked up immediately.
services:
  server:
    build:
      target: build
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/server/src:/repo/apps/server/src
      - ./packages:/repo/packages
    ports:
      - '5002:5000'

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      target: build
    command: npm run dev -- --host
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/client/src:/repo/apps/client/src
      - ./packages:/repo/packages
    ports:
      - '5173:5173'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: build
    command: npm run dev -- --host
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/admin/src:/repo/apps/admin/src
      - ./packages:/repo/packages
    ports:
      - '5174:5174'
