name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/telemedicine-ci
          JWT_ACCESS_SECRET: ci-access-secret-not-for-production
          JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production

      - name: Build
        run: npm run build
