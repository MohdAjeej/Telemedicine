server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets: cache aggressively, they're content-hashed by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # Backend API — proxied to the server container.
  location /api/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.io — needs the Upgrade/Connection headers for the WebSocket handshake.
  location /socket.io/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # React Router (SPA) fallback — everything else resolves client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
