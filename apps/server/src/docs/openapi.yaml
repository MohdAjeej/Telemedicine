openapi: 3.0.3
info:
  title: Telemedicine Management System API
  version: 1.0.0
  description: >
    REST API for the Telemedicine Management System. This document covers
    the reference modules (Auth, Appointments) in full detail as the pattern
    every other module (`/doctors`, `/patients`, `/hospitals`,
    `/consultations`, `/prescriptions`, `/vitals`, `/medical-records`,
    `/lab-reports`, `/notifications`, `/messages`, `/reports`, `/invoices`,
    `/payments`, `/audit-logs`, `/video`) follows: JWT bearer auth, a
    standard `{ success, message, data }` envelope, and `{ page, limit,
    total, totalPages }` pagination metadata for list endpoints.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, doctor, health_officer, patient] }
        firstName: { type: string }
        lastName: { type: string }
        isEmailVerified: { type: boolean }
        status: { type: string, enum: [pending, active, suspended] }
    Appointment:
      type: object
      properties:
        _id: { type: string }
        patientId: { type: string }
        doctorId: { type: string }
        hospitalId: { type: string }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: string, format: date-time }
        type: { type: string, enum: [in_person, video] }
        status: { type: string, enum: [pending, confirmed, cancelled, completed, no_show] }
        reasonForVisit: { type: string }
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      summary: Register a new patient, doctor, or health officer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                firstName: { type: string }
                lastName: { type: string }
                role: { type: string, enum: [patient, doctor, health_officer] }
      responses:
        '201': { description: Registered }
        '409': { description: Email already registered }
  /auth/login:
    post:
      summary: Log in and receive an access token plus a refresh-token cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Logged in }
        '401': { description: Invalid credentials }
  /auth/refresh:
    post:
      summary: Rotate the refresh token (cookie) and issue a new access token
      responses:
        '200': { description: Refreshed }
        '401': { description: Invalid, expired, or reused refresh token }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200': { description: Logged out }
  /auth/me:
    get:
      summary: Get the current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
  /appointments:
    get:
      summary: List appointments (scoped to the caller's role)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, confirmed, cancelled, completed, no_show] }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200': { description: OK }
    post:
      summary: Book an appointment (patient only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId, hospitalId, scheduledStart, type, reasonForVisit]
              properties:
                doctorId: { type: string }
                hospitalId: { type: string }
                scheduledStart: { type: string, format: date-time }
                type: { type: string, enum: [in_person, video] }
                reasonForVisit: { type: string }
      responses:
        '201': { description: Booked (status pending) }
        '409': { description: Doctor unavailable at that time }
  /appointments/{id}/confirm:
    post:
      summary: Confirm a pending appointment (doctor, health officer, or admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Confirmed }
        '403': { description: Not a participant with permission to confirm }
  /appointments/{id}/cancel:
    post:
      summary: Cancel an appointment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Cancelled }
