services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27019:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080,http://localhost:8081}
      MONGO_URI: mongodb://mongo:27017/telemedicine
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-telemedicine_refresh_token}
      ADMIN_HANDOFF_SECRET: ${ADMIN_HANDOFF_SECRET:-change-me-admin-handoff-secret}
      ADMIN_HANDOFF_EXPIRES_IN: ${ADMIN_HANDOFF_EXPIRES_IN:-60s}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Telemedicine Platform <no-reply@telemedicine.local>}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '5002:5000'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
        VITE_ADMIN_CONSOLE_URL: ${VITE_ADMIN_CONSOLE_URL:-http://localhost:8081}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_PASSWORD: ${VITE_TURN_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
        VITE_CLIENT_URL: ${VITE_CLIENT_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8081:80'

volumes:
  mongo_data:
